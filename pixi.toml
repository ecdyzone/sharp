[workspace]
authors = ["mumaral <mumaral@protonmail.com>"]
channels = ["conda-forge"]
name = "sharp-benchmarks"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
export2conda = "pixi workspace export conda-environment > environment.yml"

[dependencies]
python = "3.11.*"
numpy = ">=2.4.6,<3"
pyarrow = ">=20.0.0,<21"
ipython = ">=9.14.1,<10"
pytest = ">=9.0.3,<10"
openssl = ">=3.6.3,<4"
ca-certificates = ">=2026.5.20,<2027"
certifi = ">=2026.5.20,<2027"
jupyterlab = ">=4.6.1,<5"
ipykernel = ">=7.3.0,<8"

[pypi-dependencies]
sharp = { path = ".", editable = true }

# Report-only environment; existing `pixi run -e report` commands still work.
[feature.report.dependencies]
biopython = ">=1.85,<2"
python = "3.11.*"
numpy = ">=2.4.6,<3"
pyarrow = ">=20.0.0,<21"
pandas = ">=2.2,<3"
matplotlib = ">=3.9,<4"
seaborn = ">=0.13,<0.14"
pytest = ">=9.0.3,<10"

[feature.report.pypi-dependencies]
sharp = { path = ".", editable = true }

[environments]
default = { features = ["report"], solve-group = "default" }
report = { features = ["report"], no-default-feature = true }
