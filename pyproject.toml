[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sharp"
version = "0.1.0"
description = "Standalone benchmarks for SHARP and other BGC prediction tools"
requires-python = ">=3.11"

[tool.hatch.build.targets.wheel]
packages = ["src/sharp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]
